name: Build and Release

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.24.2'

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Install development dependencies
        run: sudo apt install -y libasound2-dev

      - name: Static Analysis
        uses: dominikh/staticcheck-action@v1
        with:
          version: "2025.1.1"
          install-go: false
          cache-key: go-${{ env.GO_VERSION }}

  set_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Set tag variable
        id: set_tag
        run: |
          TAG=v$(date +%Y%m%d%H%M)
          echo "$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    needs: [gitleaks, static-analysis, set_tag]

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux-amd64
            runs_on: ubuntu-latest
          - goos: linux
            goarch: arm64
            label: linux-arm64
            runs_on: ubuntu-24.04-arm
          - goos: linux
            goarch: arm64
            goarm: "8"
            label: linux-arm64-v8
            runs_on: ubuntu-24.04-arm
          - goos: windows
            goarch: amd64
            label: windows-amd64
            runs_on: ubuntu-latest
          - goos: windows
            goarch: arm64
            label: windows-arm64
            runs_on: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            label: darwin-amd64
            runs_on: ubuntu-latest
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
            runs_on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Install development dependencies
        if: ${{ matrix.goos == 'linux' }}
        run: sudo apt install -y libasound2-dev

      - name: Build
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          if [ "${{ matrix.goarm }}" != "" ]; then export GOARM=${{ matrix.goarm }}; fi
          if [ "${{ matrix.goos }}" = "linux" ]; then
            CGO_ENABLED=1 go build -ldflags="-s -w -X main.appVersion=${{ needs.set_tag.outputs.tag }}" -o dist/chrono-ntp-${{ matrix.label }} main.go
          else
            go build -ldflags="-s -w -X main.appVersion=${{ needs.set_tag.outputs.tag }}" -o dist/chrono-ntp-${{ matrix.label }}$EXT main.go
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-ntp-${{ matrix.label }}
          path: dist/chrono-ntp-${{ matrix.label }}*

  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    needs: [set_tag, build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: dist

    - name: Copy LICENSE
      run: cp LICENSE.txt dist/

    - name: Create tag
      uses: rickstaa/action-create-tag@v1
      with:
        tag: ${{ needs.set_tag.outputs.tag }}

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/**/*
        fail_on_unmatched_files: true
        tag_name: ${{ needs.set_tag.outputs.tag }}
        name: chrono-ntp ${{ needs.set_tag.outputs.tag }}
